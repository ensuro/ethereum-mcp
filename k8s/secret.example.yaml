# Reference only. Do not commit real credentials.
# Create the real secret with:
#   kubectl create secret generic ethereum-mcp-secrets \
#     --from-literal=ETHERSCAN_API_KEY=... \
#     --from-literal=ETH_NODE_URL=...
apiVersion: v1
kind: Secret
metadata:
  name: ethereum-mcp-secrets
  labels:
    app.kubernetes.io/name: ethereum-mcp
type: Opaque
stringData:
  ETHERSCAN_API_KEY: "your-etherscan-api-key"
  DUNE_API_KEY: ""
  COINGECKO_API_KEY: ""
  DEFILLAMA_API_KEY: ""
  ETH_NODE_URL: ""
